apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: msmapper-notebook
  labels:
    workflows.diamond.ac.uk/science-group-magnetic-materials: "true"
  annotations:
    workflows.argoproj.io/title: Reciprocal Space Mapper
    workflows.argoproj.io/description: |
      Runs the msmapper program to re-map detector images
      from i16 NeXus files into reciprocal lattice units.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/magnetic-materials-workflows"
    workflows.diamond.ac.uk/parameter-schema: |
      {{- .Files.Get "schemas/msmapper-notebook_param.json" | nindent 6 }}
    workflows.diamond.ac.uk/ui-schema: |
      {{- .Files.Get "schemas/msmapper-notebook_ui.json" | nindent 6 }}
spec:
  entrypoint: msmapper-notebook
  arguments:
    parameters:
      - name: visitdir
        valueFrom:
          configMapKeyRef:
            name: sessionspaces
            key: data_directory
      - name: scan_numbers
      - name: output_mode
      - name: crystal_frame
      - name: splitter_name
      - name: splitter_parameter
      - name: scale_factor
      - name: third_axis
      - name: azi_plane_normal
      - name: correct_polarisation
      - name: region
      - name: step
      - name: start
      - name: shape
      - name: reduce_box
      - name: normalisation
  volumes:
    - name: session
      hostPath:
        #path: "{{`/dls/staging/{{ workflow.parameters.visitdir }}`}}"
        path: "{{`{{ workflow.parameters.visitdir }}`}}"
        type: Directory
  volumeClaimTemplates:
    - metadata:
        name: tmp
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
        storageClassName: netapp

  templates:
    - name: run-msmapper-notebook
      script:
        image: ghcr.io/diamondlightsource/magnetic-materials-workflows/msmapper:latest
        command: [bash]
        source: |
          # mount-files
          echo '{{ .Files.Get "notebooks/msmapper_notebook.ipynb" | b64enc }}' | base64 -d > /tmp/notebook.ipynb
          # create matplotlib config dir
          mkdir -p /tmp/mpl
          mkdir -p /tmp/ipython
          mkdir -p /tmp/jupyter
          export MPLCONFIGDIR=/tmp/mpl
          export IPYTHONDIR=/tmp/ipython
          export JUPYTER_CONFIG_DIR=/tmp/jupyter
          # set msmapper java options
          export JAVA_TOOL_OPTIONS=-Duser.name=workflows
          # run notebook
          python -m papermill /tmp/notebook.ipynb /tmp/notebook.ipynb \
            -p datadir "{{`{{ workflow.parameters.visitdir }}`}}" \
            -p scan_numbers "{{`{{ workflow.parameters.scan_numbers }}`}}" \
            -p output_mode "{{`{{ workflow.parameters.output_mode }}`}}" \
            -p crystal_frame "{{`{{ workflow.parameters.crystal_frame }}`}}" \
            -p splitter_name "{{`{{ workflow.parameters.splitter_name }}`}}" \
            -p splitter_parameter {{`{{ workflow.parameters.splitter_parameter }}`}} \
            -p scale_factor {{`{{ workflow.parameters.scale_factor }}`}} \
            -p third_axis "{{`{{ workflow.parameters.third_axis }}`}}" \
            -p azi_plane_normal "{{`{{ workflow.parameters.azi_plane_normal}}`}}" \
            -p correct_polarisation "{{`{{ workflow.parameters.correct_polarisation }}`}}" \
            -p region "{{`{{ workflow.parameters.region }}`}}" \
            -p step "{{`{{ workflow.parameters.step }}`}}" \
            -p start "{{`{{ workflow.parameters.start }}`}}" \
            -p shape "{{`{{ workflow.parameters.shape }}`}}" \
            -p reduce_box "{{`{{ workflow.parameters.reduce_box }}`}}" \
            -p normalisation "{{`{{ workflow.parameters.normalisation }}`}}"
          python -m nbconvert --allow-errors --to html --output-dir /tmp /tmp/notebook.ipynb
        resources:
          requests:
            memory: 24Gi
          limits:
            memory: 24Gi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: session
            mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
            # mountPath: "{{`/dls/staging/{{ workflow.parameters.visitdir }}`}}"
      outputs:
        artifacts:
          - name: notebook
            path: /tmp/notebook.html
            archive:
              none: {}
          - name: image
            path: /tmp/msmapper_result.png
            archive:
              none: {}
          - name: histogram
            path: /tmp/msmapper_hist.png
            archive:
              none: {}
          - name: voxel-image
            path: /tmp/msmapper_voxel.png
            archive:
              none: {}
          - name: msmapper-log
            path: /tmp/msmapper_result.log
            archive:
              none: {}
          - name: msmapper-bean
            path: /tmp/tmp_remap.json
            archive:
              none: {}
    - name: msmapper-notebook
      dag:
        tasks:
          - name: run-msmapper
            template: run-msmapper-notebook
